[workspace]
changelog_config = "cliff.toml"
# Disable crates.io publishing until CARGO_REGISTRY_TOKEN is configured.
publish = false
# Without a registry baseline, release-plz cannot compute the next version.
# git_only = true tells release-plz to use the latest git tag as the version baseline.
# Required when publish = false. Standard: councils/os/decisions/260502-release-pipeline-standard.md
git_only = true
# cargo-dist owns GitHub Release creation (with binary assets).
# release-plz creates git tags only; GitHub Releases are created by cargo-dist.
git_release_enable = false
# Enforce package-prefixed tags: accelmars-anchor-v{version}
git_tag_name = "{{ package }}-v{{ version }}"

# Per-package overrides
# changelog_update = false: cliff (root CHANGELOG.md) is the single source of truth.
# Without this override, release-plz manages a per-package CHANGELOG separately
# from cliff's root CHANGELOG.md; auto-merge triggers another release-plz scan,
# which finds the per-package file out of sync, creates another release PR — infinite loop.
# Decision: 260501-public-repo-release-pipeline.md
[[package]]
name = "accelmars-anchor"
changelog_update = false
# Skip cargo package --verify step: accelmars-os-env is a path dep (publish = false)
# not on crates.io; the verify build would try to download it and fail.
publish_no_verify = true

# Private workspace member (publish = false) — excluded from release-plz.
# release-plz auto-discovers workspace members; without `release = false` it
# treats accelmars-os-env as an "initial release" package and runs cargo package
# on it. Explicit exclusion keeps release-plz scoped to accelmars-anchor only.
# Note: dep in anchor's Cargo.toml must declare version = "0.1.0" so cargo
# package manifest validation passes (path dep stripped → registry fallback).
[[package]]
name = "accelmars-os-env"
release = false
